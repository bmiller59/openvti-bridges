name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # `Cargo.lock` is not committed yet (README, "Cargo.lock"), so each job that builds
  # generates it first. Nothing here has run yet: see README, "What CI runs today".
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - run: cargo generate-lockfile
      # Per crate (a per-crate build compiles what feature unification hides) and the whole workspace.
      - run: cargo clippy -p openvti-bridge-core --all-targets -- -D warnings
      - run: cargo clippy -p openvti-bridge-geb --all-targets -- -D warnings
      - run: cargo clippy -p openvti-bridge-geb --all-targets --features "live mls" -- -D warnings
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --features harness -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: cargo generate-lockfile
      - run: cargo test -p openvti-bridge-core
      - run: cargo test -p openvti-bridge-geb
      - run: cargo test -p openvti-bridge-geb --features "live mls"
      - run: cargo test --workspace
      # Adds the bridge crate's tests/custody.rs and tests/cli.rs (they need `vta-sdk/test-loopback`, not a room host).
      - run: cargo test --workspace --features harness

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: cargo generate-lockfile
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # CONTRIBUTING.md requires a Signed-off-by trailer on every commit. Cryptographic signatures
  # are not checked here (CI has no key to check them against).
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit in the PR carries Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git show -s --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "missing Signed-off-by: $(git log -1 --format='%h %s' "$c")"
              bad=1
            fi
          done
          exit $bad

  # The room-host harness (`harness/`, a separate package) needs `room-host`, which is not
  # published and sits under a placeholder git URL in harness/Cargo.toml. Until that URL is
  # real it cannot resolve, so this job is manual-only and is expected to fail if run.
  room-host-harness:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: cd harness && cargo test
