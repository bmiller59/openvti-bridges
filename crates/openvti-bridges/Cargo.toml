[package]
name = "openvti-bridges"
description = "Experimental … foreign room (first adapter: Geb)"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["geb"]
# The bridge kinds this build registers (`registry::kinds`). `geb` brings the Geb adapter
# with its live relay client and MLS; `loopback` registers the core's in-memory kind (a
# development kind with an `echo` verb).
geb = ["dep:openvti-bridge-geb"]
loopback = []
# Test support for the tests that need no room host: `HostDelivery::for_loopback_tests`
# and `vta-sdk`'s loopback sink for `tests/custody.rs` and `tests/cli.rs`. The tests
# that need a real `room-host` are the separate `harness/` package.
harness = ["openvti-bridge-vtc/harness", "openvti-bridge-geb?/harness", "vta-sdk/test-loopback"]
# The OS keyring as the secret store. The binary registers a platform store at startup
# when built with this feature.
keyring = ["openvti-bridge-vtc/keyring", "vti-secrets/keyring", "vta-sdk/keyring"]

[[bin]]
name = "openvti-bridges"
path = "src/main.rs"

[dependencies]
openvti-bridge-core = { path = "../openvti-bridge-core" }
openvti-bridge-vtc = { path = "../openvti-bridge-vtc" }
openvti-bridge-geb = { path = "../openvti-bridge-geb", features = ["live", "mls"], optional = true }
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
vta-sdk = { version = "0.85", features = ["client", "provision-client", "crypto-provider"] }
vti-secrets = "0.34"
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tracing = "0.1"
x25519-dalek = { version = "3", features = ["static_secrets"] }
ed25519-dalek = "3"
multibase = "0.9"
rand = "0.10"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.49", features = ["macros", "rt", "rt-multi-thread", "sync"] }

[lints]
workspace = true
