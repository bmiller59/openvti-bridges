# cargo-deny configuration, adapted from the VTI repository's deny.toml.
#
# Run with:
#   cargo install cargo-deny
#   cargo deny check
#
# Only the advisory ignores that apply to this crate's graph are kept; the rest of
# the VTI list (AWS SDK, UniFFI, PGP, zip) never reaches it. Re-check the list
# with `cargo deny check` when the lock file changes: an entry reported as
# `advisory-not-detected` is stale.

[graph]
all-features = true

[advisories]
version = 2
ignore = [

  { id = "RUSTSEC-2026-0387", reason = """
  crypto-bigint 0.5.5: constant-time issues in secret-dependent arithmetic;
  fixed in >= 0.7.6. UNVERIFIED beyond the code trace below: no timing
  measurement or independent review was done.

  Path: openvti-bridge-geb (feature `mls`) -> openmls_rust_crypto 0.6 ->
  hpke-rs-rust-crypto 0.7 / p256 0.13 / p384 0.13 / k256 0.13 / ecdsa 0.16
  -> elliptic-curve 0.13 -> crypto-bigint 0.5.5 (also openmls_basic_credential
  0.6 -> p256 / p384). Nothing else in this workspace reaches 0.5.5: our own
  k256 0.14 and the VTI crates resolve to elliptic-curve 0.14 and
  crypto-bigint 0.7.x (checked with `cargo tree -i crypto-bigint@0.5.5
  --all-features`, normal and build edges).

  We cannot upgrade it: the 0.13 RustCrypto curve stack is pinned by
  openmls_rust_crypto 0.6 and hpke-rs-rust-crypto 0.7, and OpenMLS has no
  other production crypto provider.

  What the trace found, for the one ciphersuite the bridge uses (0x0001,
  MLS_128_DHKEMX25519_AES128GCM_SHA256_Ed25519, fixed by `SUITE` in
  mls/identity.rs): the KEM is DhKem25519 (x25519-dalek in hpke-rs-rust-crypto)
  and signatures are Ed25519 (ed25519-dalek in openmls_rust_crypto and
  openmls_basic_credential), neither of which uses crypto-bigint. The
  P-256 / P-384 / secp256k1 code in those crates is selected by ciphersuite or
  signature scheme, and none of our code names those: the signer is built with
  SUITE.signature_algorithm(), a Welcome whose ciphersuite is not 0x0001 is
  rejected, and the bridge's own code uses no P-256 (its secp256k1 is k256 0.14,
  which is on crypto-bigint 0.7.x). So p256 / p384 / k256 0.13 are linked but,
  on the paths we found, not run with a secret scalar.

  Not verified: that every path inside openmls 0.9 is suite-gated (a Welcome
  is parsed with StagedWelcome::new_from_welcome before our 0x0001 check, and
  the default leaf capabilities advertise the P-256 suite, which only declares
  support); the `harness/` package's own lockfile; and anything about
  dev-dependency or non-default feature graphs beyond `--all-features`.

  Revisit when openmls_rust_crypto / hpke-rs-rust-crypto move to RustCrypto
  curves on crypto-bigint >= 0.7.6, and drop this entry then.
  """ },


  { id = "RUSTSEC-2026-0173", reason = """
  proc-macro-error2 2.0.1 is unmaintained — the author has said so and
  recommends migrating away. Build-time only, and twice removed from
  anything we ship: it is a proc-macro, so it runs in the compiler and
  links into no artifact, and its path into this crate is
  the `mls` feature of `openvti-bridge-geb` (and vtc-client's `mls` in the `harness/` package) —
  openmls_rust_crypto -> hpke-rs -> libcrux-sha3 -> hax-lib ->
  hax-lib-macros. A default build of every crate here does not resolve
  it at all.

  There is no version of this we can pick differently. OpenMLS 0.9 has
  one production crypto provider and this is what it depends on; the
  alternative is not a cleaner MLS but a hand-rolled group-key scheme,
  which the data-rooms design note explicitly declines.

  Drop when hax-lib moves off proc-macro-error2, or when OpenMLS's
  provider stack stops reaching libcrux.
  """ },


]

# License policy: permissive and weak-copyleft licenses compatible with Apache-2.0.
# Entries come from the VTI repository; prune any that no crate here uses.
#
# cargo-deny resolves OR-licensed crates against this allow list, so
# crates licensed under e.g. `Apache-2.0 OR GPL-2.0-only` or
# `MIT OR Apache-2.0 OR LGPL-2.1-or-later` automatically resolve to a
# permissive branch we accept — no need to allow the copyleft alternatives.
[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  # MIT No Attribution — MIT minus the copyright-notice preservation
  # clause. OSI-approved, more permissive than MIT itself. Pulled in
  # transitively via regorus → jsonschema → referencing → fluent-uri
  # → borrow-or-share. Consistent with the "0BSD" entry below, which
  # is the functionally-equivalent BSD variant we already accept.
  "MIT-0",
  "Apache-2.0",
  # Apache-2.0 plus the LLVM exception, which only waives obligations for
  # code compiled into a binary — strictly more permissive than Apache-2.0.
  # Pulled in as a build dependency (target-lexicon) of tss-esapi-sys, behind
  # vti-secrets' optional `tpm` feature (#1820).
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "Unicode-3.0",
  "0BSD",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "Zlib",
  "MPL-2.0",
]

